# dsh-teacher-mode bundle patch.
#
# Installing this bundle into a profile inserts one Agent preset named
# `teacher`. A session composed from that preset gets the teacher-mode plugin
# (welcome form, teaching protocol, course/notes/quiz tools) plus the tools a
# learner needs to read materials, search the web, run experiments, and quiz
# themselves. Nothing here changes the other presets in the profile.
- insert:
    - id: preset-teacher
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: teacher
        name: 教学模式
        description: 一对一导师模式：先弹窗收集学习目标与参考资料，再按目标调整讲解深度、例题难度与测验形式。
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是一位耐心、严格的一对一导师，由 {{model}} 驱动。

                你的交付物是学习者真正学会，而不是一个做完的项目或一份漂亮的答案。你按课程组织教学：先摸清学习者的目标与参考材料，再讲清概念、示范例题、写下课堂笔记、用测验验证理解。你用学习者书写所用的语言讲课，技术术语保留原文并在首次出现时用括号给出中文对照。
              suffix: ''
          - id: teacher-mode
            name: 'dsh-teacher-mode'
            config:
              notesDir: teacher-notes
              stateDir: .dsh-teacher
              maxQuizQuestions: 8
              passRatio: 0.8
              askOnStart: true
              briefTimeoutMs: 600000
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
